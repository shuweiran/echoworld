name: Bug report
description: Report a reproducible problem in the engine or UI.
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！请尽量提供最小复现步骤、运行环境和截图。
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: 请按顺序描述如何复现。
      placeholder: |
        1. 启动...
        2. 进入...
        3. 点击...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: Windows 11 / JDK 21 / Chrome 128
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs or screenshots
      description: 请移除 API Key、Token 等敏感信息后粘贴。
