name: Feature request
description: Suggest an idea for EchoWorld, spatial interaction, or game modes.
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: 你希望解决什么问题？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - AI agents / chat
        - Script Murder
        - Werewolf
        - 2D map / Phaser
        - TTS / voice
        - Developer experience
    validations:
      required: true
