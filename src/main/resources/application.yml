server:
  port: 8000

spring:
  mvc:
    async:
      request-timeout: 300000  # SSE 长连接超时（与 SSEController SSE_TIMEOUT_MS 一致，覆盖 Tomcat 默认 30s）
  datasource:
    url: jdbc:h2:file:./data/roleplay;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

roleplay:
  llm:
    api-base: "https://api.deepseek.com"
    api-key: "${ROLEPLAY_LLM_API_KEY:}"
    model: "deepseek-v4-flash"
    max-tokens: 4096
    temperature: 0.9
    fallback-model: "deepseek-v4-flash"
    timeout-seconds: 60
  memory:
    short-term-rounds: 20
    summary-interval: 10
  round:
    parallel-agents: true
    agent-max-tokens: 300
    arbiter-max-tokens: 150
  mode:
    default: "free"
    language: "zh"
  game:
    approval:
      # 审批门（D7）：剧本杀揭晓 / 狼人杀投票结算挂起等待 DM 审批；true=手动审批（超时自动驳回回滚），false=自动通过
      enabled: true
      timeout-seconds: 60
  frontend:
    dev-mode: false
    dev-port: 5173
    dist-dir: "../roleplay-v4/frontend/dist"
