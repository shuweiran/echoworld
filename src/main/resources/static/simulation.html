<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simulation - 2D World</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Segoe UI', system-ui, sans-serif; background: #0f172a; color: #e2e8f0; display: flex; height: 100vh; overflow: hidden; }
#main { flex: 1; display: flex; flex-direction: column; }
#toolbar { display: flex; gap: 8px; padding: 10px 16px; background: #1e293b; border-bottom: 1px solid #334155; align-items: center; }
#toolbar h2 { font-size: 16px; margin-right: 16px; color: #38bdf8; }
.btn { padding: 6px 16px; border: 1px solid #475569; border-radius: 6px; cursor: pointer; font-size: 13px; background: #334155; color: #e2e8f0; transition: all 0.15s; }
.btn:hover { background: #475569; }
.btn.active { background: #16a34a; border-color: #16a34a; }
.btn.danger { background: #991b1b; border-color: #991b1b; }
.btn.danger:hover { background: #b91c1c; }
#canvas-wrap { flex: 1; position: relative; overflow: hidden; }
canvas { display: block; width: 100%; height: 100%; }
#panel { width: 320px; background: #1e293b; border-left: 1px solid #334155; display: flex; flex-direction: column; overflow: hidden; }
#panel h3 { padding: 12px 16px; font-size: 14px; color: #94a3b8; border-bottom: 1px solid #334155; }
#conv-list { flex: 1; overflow-y: auto; padding: 8px; }
.conv-item { background: #0f172a; border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; font-size: 12px; line-height: 1.5; }
.conv-item .pair { font-size: 11px; color: #64748b; margin-bottom: 4px; }
.conv-item .msg { margin: 2px 0; }
.conv-item .name { font-weight: 600; color: #38bdf8; }
.conv-item .name.f { color: #f472b6; }
#legend { padding: 12px 16px; border-top: 1px solid #334155; font-size: 12px; }
.legend-row { display: flex; align-items: center; gap: 8px; margin: 4px 0; }
.legend-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
#status { font-size: 11px; color: #64748b; padding: 0 16px 8px; }
#stats { display: flex; gap: 16px; font-size: 12px; color: #94a3b8; align-items: center; }
#stats span { color: #38bdf8; font-weight: 600; }
#narration-bar { padding: 6px 16px; background: #0f172a; border-bottom: 1px solid #334155; font-size: 13px; color: #fbbf24; min-height: 28px; display: flex; align-items: center; gap: 8px; }
#narration-bar .dir-label { font-size: 10px; background: #fbbf24; color: #0f172a; padding: 1px 6px; border-radius: 3px; font-weight: 600; flex-shrink: 0; }
#narration-bar .dir-active { animation: pulse 1s infinite; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }
#directive-wrap { display: flex; gap: 4px; margin-left: auto; }
#directive-input { background: #0f172a; border: 1px solid #475569; border-radius: 4px; color: #e2e8f0; padding: 3px 8px; font-size: 12px; width: 180px; outline: none; }
#directive-input:focus { border-color: #fbbf24; }
#directive-input::placeholder { color: #64748b; }
#send-dir { padding: 3px 10px; font-size: 12px; }

/* Character config modal */
#char-modal { display: none; position: fixed; inset: 0; z-index: 100; background: #00000080; align-items: center; justify-content: center; }
#char-modal.show { display: flex; }
#char-panel { background: #1e293b; border: 1px solid #334155; border-radius: 12px; width: 500px; max-height: 80vh; overflow-y: auto; padding: 20px; }
#char-panel h3 { margin-bottom: 16px; font-size: 16px; color: #38bdf8; border: none; padding: 0; }
.char-row { display: flex; gap: 8px; margin-bottom: 8px; align-items: center; }
.char-row input { flex: 1; background: #0f172a; border: 1px solid #475569; border-radius: 4px; color: #e2e8f0; padding: 6px 8px; font-size: 13px; outline: none; }
.char-row input:focus { border-color: #38bdf8; }
.char-row input.persona { flex: 2; }
.char-row .del-btn { background: none; border: none; color: #ef4444; cursor: pointer; font-size: 18px; padding: 0 4px; line-height: 1; }
.char-row .del-btn:hover { color: #dc2626; }
#char-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
#scene-tip { font-size: 12px; color: #64748b; margin: 8px 0; }
.add-btn { background: none; border: 1px dashed #475569; border-radius: 4px; color: #94a3b8; cursor: pointer; padding: 6px; width: 100%; font-size: 13px; margin-top: 4px; }
.add-btn:hover { border-color: #38bdf8; color: #38bdf8; }
</style>
</head>
<body>
<div id="main">
  <div id="toolbar">
    <h2>2D Simulation</h2>
    <select id="scene-sel" onchange="setScene(this.value)" style="background:#334155;border:1px solid #475569;border-radius:6px;color:#e2e8f0;padding:5px 8px;font-size:13px;">
      <option value="park">Park</option>
      <option value="city">City</option>
      <option value="cafe">Cafe</option>
      <option value="forest">Forest</option>
      <option value="classroom">Classroom</option>
      <option value="beach">Beach</option>
    </select>
    <select id="agent-count-sel" style="background:#334155;border:1px solid #475569;border-radius:6px;color:#e2e8f0;padding:5px 8px;font-size:13px;">
      <option value="2">2 Agents</option>
      <option value="3">3 Agents</option>
      <option value="4">4 Agents</option>
      <option value="5">5 Agents</option>
      <option value="6">6 Agents</option>
      <option value="8">8 Agents</option>
    </select>
    <button class="btn" onclick="initDemo()">Init</button>
    <button class="btn" onclick="openCharModal()">自定义角色</button>
    <button class="btn" id="btn-start" onclick="toggleStart()">Start</button>
    <button class="btn danger" onclick="stopSim()">Stop</button>
    <button class="btn" onclick="resetSim()">Reset</button>
    <div id="stats">
      Tick: <span id="tick-num">0</span>
      Agents: <span id="agent-count">0</span>
    </div>
    <div id="directive-wrap">
      <input id="directive-input" placeholder="给主控指令..." onkeydown="if(event.key==='Enter')sendDirective()">
      <button class="btn" id="send-dir" onclick="sendDirective()">发送</button>
    </div>
  </div>
  <div id="narration-bar">
    <span class="dir-label" id="dir-label">主控</span>
    <span id="narration-text">等待初始化...</span>
  </div>
  <div id="canvas-wrap">
    <canvas id="cvs"></canvas>
  </div>
</div>
<div id="panel">
  <h3>Conversations</h3>
  <div id="group-status" style="padding:4px 16px;font-size:11px;color:#64748b"></div>
  <div id="conv-list"><div style="color:#64748b;text-align:center;padding:20px">No conversations yet</div></div>
  <div id="legend"></div>
  <div style="border-top:1px solid #334155; padding:10px 12px;">
    <div style="font-size:12px;color:#94a3b8;margin-bottom:6px;">说话</div>
    <div id="chat-msgs" style="font-size:12px;max-height:100px;overflow-y:auto;margin-bottom:6px;color:#cbd5e1;"></div>
    <div style="display:flex;gap:6px;">
      <input id="chat-input" placeholder="对小明们说点什么..." style="flex:1;padding:6px 10px;border:1px solid #334155;border-radius:4px;background:#1e293b;color:#e2e8f0;font-size:12px;outline:none;">
      <button style="padding:6px 14px;border:1px solid #38bdf8;border-radius:4px;background:#38bdf8;color:#0f172a;font-size:12px;cursor:pointer;font-weight:600;" onclick="sendChat()">发送</button>
    </div>
  </div>
  <div id="status">Ready</div>
</div>

<!-- Character config modal -->
<div id="char-modal">
  <div id="char-panel">
    <h3>配置角色 <span class="char-count" id="char-count">2 人</span></h3>
    <p id="scene-tip">每个角色输入名字和性格描述，他们会自动在 2D 世界中相遇对话</p>
    <div id="char-form-rows"></div>
    <button class="add-btn" onclick="addCharRow()">+ 添加角色</button>
    <div id="char-actions">
      <button class="btn" onclick="closeCharModal()">取消</button>
      <button class="btn active" onclick="confirmCharModal()">开始模拟</button>
    </div>
  </div>
</div>

<script>
const API = '/api/simulation';
const WORLD_W = 1000, WORLD_H = 600;

const cvs = document.getElementById('cvs');
const ctx = cvs.getContext('2d');
let agents = {};
let tick = 0;
let running = false;
let es = null;
let clickTarget = null; // {x, y, name}
let obstacles = [];
let currentScene = 'park';
let conversations = [];
let worldNarration = '';
let directorActive = false;
let convGroups = [];

const colors = ['#38bdf8','#f472b6','#a78bfa','#34d399','#fb923c','#f87171','#e879f9','#2dd4bf'];
function agentColor(name) {
  let h = 0;
  for (let i=0;i<name.length;i++) h = ((h<<5)-h)+name.charCodeAt(i);
  return colors[Math.abs(h) % colors.length];
}

function resize() {
  const wrap = document.getElementById('canvas-wrap');
  cvs.width = wrap.clientWidth;
  cvs.height = wrap.clientHeight;
}
window.addEventListener('resize', resize);
resize();

// Canvas click handler: set movement target for player
cvs.addEventListener('click', function(e) {
  const rect = cvs.getBoundingClientRect();
  const W = cvs.width, H = cvs.height;
  const sx = W / WORLD_W, sy = H / WORLD_H, s = Math.min(sx, sy);
  const ox = (W - WORLD_W * s) / 2, oy = (H - WORLD_H * s) / 2;
  const worldX = (e.clientX - rect.left - ox) / s;
  const worldY = (e.clientY - rect.top - oy) / s;
  if (worldX < 0 || worldX > WORLD_W || worldY < 0 || worldY > WORLD_H) return;

  // Find a player-like agent
  let meName = null;
  const aList = Object.values(agents);
  for (const a of aList) {
    if (a.agentName === 'me' || a.agentName === '\u6211' || a.agentName === '\u4e3b\u4eba') {
      meName = a.agentName; break;
    }
  }
  if (!meName && aList.length > 0) meName = aList[0].agentName;
  if (!meName) return;

  const cx = Math.round(Math.max(10, Math.min(WORLD_W - 10, worldX)) * 100) / 100;
  const cy = Math.round(Math.max(10, Math.min(WORLD_H - 10, worldY)) * 100) / 100;
  fetch('/api/simulation/target/' + encodeURIComponent(meName), {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({x: cx, y: cy})
  }).catch(()=>{});
  clickTarget = {x: cx, y: cy, name: meName};
  setTimeout(() => { if (clickTarget?.name === meName) clickTarget = null; }, 4000);
});

cvs.addEventListener('mousemove', function(e) {
  const rect = cvs.getBoundingClientRect();
  const sx = cvs.width / WORLD_W, sy = cvs.height / WORLD_H, s = Math.min(sx, sy);
  const ox = (cvs.width - WORLD_W * s) / 2, oy = (cvs.height - WORLD_H * s) / 2;
  const wx = (e.clientX - rect.left - ox) / s;
  const wy = (e.clientY - rect.top - oy) / s;
  cvs.style.cursor = (wx >= 0 && wx <= WORLD_W && wy >= 0 && wy <= WORLD_H) ? 'pointer' : 'default';
});
cvs.addEventListener('mouseleave', () => cvs.style.cursor = 'default');

function draw() {
  const W = cvs.width, H = cvs.height;
  ctx.clearRect(0,0,W,H);

  const sx = W / WORLD_W, sy = H / WORLD_H, s = Math.min(sx, sy);
  const ox = (W - WORLD_W * s) / 2, oy = (H - WORLD_H * s) / 2;

  ctx.save();
  ctx.translate(ox, oy);
  ctx.scale(s, s);

  // world border
  ctx.strokeStyle = '#334155';
  ctx.lineWidth = 2;
  ctx.strokeRect(0, 0, WORLD_W, WORLD_H);

  // grid
  ctx.strokeStyle = '#1e293b';
  ctx.lineWidth = 0.5;
  for (let x=100;x<WORLD_W;x+=100) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,WORLD_H); ctx.stroke(); }
  for (let y=100;y<WORLD_H;y+=100) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(WORLD_W,y); ctx.stroke(); }

  for (const obs of obstacles) {
    const t = obs.type;
    ctx.fillStyle = t==='BUILDING'||t==='WALL'?'#334155':
                    t==='WATER'?'#1e3a5f':t==='TABLE'?'#4a3728':
                    t==='TREE'?'#064e3b':t==='ROCK'?'#57534e':
                    t==='BUSH'?'#14532d':t==='BENCH'?'#78350f':
                    t==='FOUNTAIN'?'#1e40af':'#3f3f46';
    ctx.strokeStyle = t==='WALL'?'#64748b':'#475569';
    ctx.lineWidth = 1;
    ctx.fillRect(obs.x, obs.y, obs.width, obs.height);
    ctx.strokeRect(obs.x, obs.y, obs.width, obs.height);
    if (obs.label) {
      ctx.font = '9px sans-serif';
      ctx.fillStyle = '#94a3b8';
      ctx.textAlign = 'center';
      ctx.fillText(obs.label, obs.x + obs.width/2, obs.y + obs.height/2 + 3);
    }
    if (obs.blocksSound) {
      ctx.strokeStyle = '#ef444433';
      ctx.lineWidth = 0.5;
      ctx.setLineDash([2,4]);
      ctx.strokeRect(obs.x-2, obs.y-2, obs.width+4, obs.height+4);
      ctx.setLineDash([]);
    }
  }

  const agentList = Object.values(agents);

  // hearing ranges + connection lines
  for (const a of agentList) {
    ctx.strokeStyle = a.color + '22';
    ctx.lineWidth = 1;
    ctx.setLineDash([6, 6]);
    ctx.beginPath();
    ctx.arc(a.x, a.y, a.hearRange * 0.7, 0, Math.PI*2);
    ctx.stroke();

    ctx.strokeStyle = a.color + '15';
    ctx.beginPath();
    ctx.arc(a.x, a.y, a.hearRange * 2.5, 0, Math.PI*2);
    ctx.stroke();
    ctx.setLineDash([]);
  }

  // connection lines between nearby agents
  for (let i=0;i<agentList.length;i++) {
    for (let j=i+1;j<agentList.length;j++) {
      const a=agentList[i], b=agentList[j];
      const dx=a.x-b.x, dy=a.y-b.y;
      const dist = Math.sqrt(dx*dx+dy*dy);
      const range = Math.min(a.hearRange, b.hearRange) * 0.7;
      if (dist <= range) {
        ctx.strokeStyle = '#fbbf2433';
        ctx.lineWidth = 1;
        ctx.setLineDash([4, 4]);
        ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
        ctx.setLineDash([]);
      }
    }
  }

  // click target marker
  if (clickTarget) {
    ctx.strokeStyle = '#38bdf866';
    ctx.lineWidth = 2;
    ctx.setLineDash([4, 4]);
    const cx = clickTarget.x, cy = clickTarget.y;
    ctx.beginPath(); ctx.moveTo(cx-8, cy); ctx.lineTo(cx+8, cy); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx, cy-8); ctx.lineTo(cx, cy+8); ctx.stroke();
    ctx.setLineDash([]);
    ctx.strokeStyle = '#38bdf844';
    ctx.beginPath(); ctx.arc(cx, cy, 6, 0, Math.PI*2); ctx.stroke();
  }

  // agents
  for (const a of agentList) {
    const r = 12;

    // glow when in conversation
    if (a.inConversation) {
      const grd = ctx.createRadialGradient(a.x, a.y, r*0.5, a.x, a.y, r*2.5);
      grd.addColorStop(0, a.color + '60');
      grd.addColorStop(1, a.color + '00');
      ctx.fillStyle = grd;
      ctx.beginPath(); ctx.arc(a.x, a.y, r*2.5, 0, Math.PI*2); ctx.fill();
    }

    // dot
    ctx.fillStyle = a.color;
    ctx.beginPath(); ctx.arc(a.x, a.y, r, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 2;
    ctx.stroke();

    // emotion emoji
    ctx.font = '14px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillStyle = '#fff';
    ctx.fillText(a.emotionEmoji || '😐', a.x, a.y - r - 8);

    // name
    ctx.font = 'bold 12px sans-serif';
    ctx.fillStyle = a.color;
    ctx.fillText(a.agentName, a.x, a.y + r + 16);

    // speed indicator
    const speed = Math.sqrt((a.vx||0)*(a.vx||0)+(a.vy||0)*(a.vy||0));
    if (speed > 2) {
      ctx.strokeStyle = a.color + '80';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(a.x, a.y);
      ctx.lineTo(a.x + (a.vx||0)*2, a.y + (a.vy||0)*2);
      ctx.stroke();
    }

    // message bubble
    if (a.currentMessage && !a.currentMessage.startsWith('(\u4e3b\u63a7')) {
      const msg = a.currentMessage.length > 50 ? a.currentMessage.slice(0,50)+'...' : a.currentMessage;
      ctx.font = '11px sans-serif';
      const tw = ctx.measureText(msg).width;
      const bw = tw + 16, bh = 20;
      const bx = a.x - bw/2, by = a.y - r - 36;
      ctx.fillStyle = '#1e293bcc';
      ctx.strokeStyle = a.color + '80';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.roundRect(bx, by, bw, bh, 6);
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = '#e2e8f0';
      ctx.textAlign = 'center';
      ctx.fillText(msg, a.x, by + 14);
    }
  }

  for (const g of convGroups) {
    const members = g.participants || [];
    if (members.length < 2) continue;
    let minX=Infinity, minY=Infinity, maxX=-Infinity, maxY=-Infinity;
    members.forEach(name => {
      const a = agents[name];
      if (!a) return;
      minX = Math.min(minX, a.x-25); maxX = Math.max(maxX, a.x+25);
      minY = Math.min(minY, a.y-50); maxY = Math.max(maxY, a.y+25);
    });
    const modeColors = {DYAD:'#38bdf8',GROUP_DISCUSSION:'#a78bfa',PUBLIC_SPEAKING:'#fbbf24',DEBATE:'#ef4444'};
    const mc = modeColors[g.mode] || '#38bdf8';
    ctx.strokeStyle = mc;
    ctx.lineWidth = 1.5;
    ctx.setLineDash([8,4]);
    const pad = 15;
    ctx.strokeRect(minX-pad, minY-pad, maxX-minX+pad*2, maxY-minY+pad*2);
    ctx.setLineDash([]);

    ctx.fillStyle = mc;
    ctx.font = 'bold 10px sans-serif';
    ctx.textAlign = 'left';
    const lbl = `${g.mode} (R${g.rounds})`;
    ctx.fillText(lbl, minX-pad, minY-pad-4);
  }

  ctx.restore();

  // narration overlay
  if (worldNarration) {
    const txt = '【主控】' + worldNarration;
    ctx.font = '13px sans-serif';
    ctx.fillStyle = '#0f172acc';
    const tw = ctx.measureText(txt).width + 20;
    ctx.fillRect(W/2 - tw/2, 8, tw, 26);
    ctx.fillStyle = '#fbbf24';
    ctx.textAlign = 'center';
    ctx.fillText(txt, W/2, 26);
  }
}

function renderLoop() {
  draw();
  requestAnimationFrame(renderLoop);
}
requestAnimationFrame(renderLoop);

function fetchState() {
  fetch(API+'/state').then(r=>r.json()).then(d=>{
    tick = d.tick || 0;
    running = d.running;
    document.getElementById('tick-num').textContent = tick;
    document.getElementById('btn-start').textContent = running ? 'Pause' : 'Start';
    document.getElementById('btn-start').classList.toggle('active', running);
    const ags = d.agents || [];
    const newAgents = {};
    ags.forEach(a=>{
      const name = a.agentName;
      const prev = agents[name];
      newAgents[name] = {
        ...(prev||{}),
        ...a,
        vx: a.vx||0, vy: a.vy||0,
        color: prev?.color || agentColor(name)
      };
    });
    agents = newAgents;
    document.getElementById('agent-count').textContent = ags.length;
    updateLegend();
    if (d.recentConversations) {
      conversations = d.recentConversations;
      renderConvs();
    }
    worldNarration = d.worldNarration || '';
    directorActive = d.directorActive || false;
    obstacles = d.obstacles || [];
    currentScene = d.scene || 'park';
    document.getElementById('scene-sel').value = currentScene;
    updateNarration();
    document.getElementById('status').textContent = running
      ? (ags.some(a=>a.inConversation) ? 'Conversation active' : 'Agents moving')
      : 'Stopped';
  });
}

function startSSE() {
  if (es) es.close();
  es = new EventSource(API+'/events');
  es.onmessage = e => {
    try {
      const d = JSON.parse(e.data);
      tick = d.tick || tick;
      document.getElementById('tick-num').textContent = tick;
      if (d.agents) {
        d.agents.forEach(a=>{
          const name = a.agentName;
          const prev = agents[name];
          agents[name] = {
            ...(prev||{}),
            ...a,
            color: prev?.color || agentColor(name)
          };
        });
      }
      worldNarration = d.worldNarration || worldNarration;
      directorActive = d.directorActive || false;
      if (d.obstacles) obstacles = d.obstacles;
      if (d.scene) { currentScene = d.scene; document.getElementById('scene-sel').value = currentScene; }
      updateNarration();
      document.getElementById('status').textContent = Object.values(agents).some(a=>a.inConversation)
        ? 'Conversation active' : 'Agents moving';
    } catch(_){}
  };
  es.onerror = () => {
    document.getElementById('status').textContent = 'SSE disconnected';
  };
}

function renderConvs() {
  const el = document.getElementById('conv-list');
  if (!conversations.length) {
    el.innerHTML = '<div style="color:#64748b;text-align:center;padding:20px">No conversations yet</div>';
    return;
  }
  el.innerHTML = conversations.slice().reverse().map(c => {
    const keys = Object.keys(c).filter(k=>!['pair','group','mode','tick','elapsedMs','round'].includes(k));
    const header = c.group ? `[${c.mode||'DYAD'}] ${c.group} | R${c.round||1}` : `Tick #${c.tick} | ${c.pair}`;
    return `<div class="conv-item">
      <div class="pair">${header}</div>
      ${keys.map(k => {
        const isA = agents[k]?.color === colors[0];
        return `<div class="msg"><span class="name${isA?'':' f'}">${k}:</span> ${esc(c[k])}</div>`;
      }).join('')}
    </div>`;
  }).join('');
  el.scrollTop = 0;
  fetchConvStatus();
}

async function fetchConvStatus() {
  try {
    const r = await fetch(API+'/conversation-status');
    const d = await r.json();
    convGroups = d.groups || [];
    const el = document.getElementById('group-status');
    if (d.activeGroups > 0 && d.groups) {
      el.innerHTML = d.groups.map(g => {
        const topic = g.topic ? ` ${g.topic.description}` : '';
        return `<span style="color:#fbbf24">${g.mode}</span> ${g.participants.join(',')} (R${g.rounds}/${g.turns}t)${topic}`;
      }).join('<br>');
    } else if (d.activeGroups === 0) {
      el.innerHTML = '<span style="color:#475569">Idle</span>';
    }
  } catch(e) {}
}
function esc(s) {
  if (!s) return '';
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

async function api(method, path, body) {
  const opts = { method, headers: {} };
  if (body) { opts.headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(body); }
  const r = await fetch(API+path, opts);
  return r.json();
}

async function initDemo() {
  const count = parseInt(document.getElementById('agent-count-sel').value) || 2;
  await api('POST', '/init', {count});
  await fetchState();
  startSSE();
}
async function toggleStart() {
  if (running) { await stopSim(); } else { await startSim(); }
}
async function startSim() {
  await api('POST', '/start');
  running = true;
  document.getElementById('btn-start').textContent = 'Pause';
  document.getElementById('btn-start').classList.add('active');
  if (!es) startSSE();
  await fetchState();
}
async function stopSim() {
  await api('POST', '/stop');
  running = false;
  document.getElementById('btn-start').textContent = 'Start';
  document.getElementById('btn-start').classList.remove('active');
  await fetchState();
}
async function resetSim() {
  if (es) { es.close(); es = null; }
  await api('POST', '/reset');
  agents = {};
  conversations = [];
  tick = 0;
  document.getElementById('tick-num').textContent = '0';
  document.getElementById('agent-count').textContent = '0';
  document.getElementById('status').textContent = 'Ready';
  document.getElementById('conv-list').innerHTML = '<div style="color:#64748b;text-align:center;padding:20px">No conversations yet</div>';
  document.getElementById('legend').innerHTML = '';
  worldNarration = '';
  directorActive = false;
  updateNarration();
}

function updateLegend() {
  const el = document.getElementById('legend');
  const names = Object.keys(agents);
  if (!names.length) { el.innerHTML = ''; return; }
  el.innerHTML = names.map(name => {
    const a = agents[name];
    const color = a.color || agentColor(name);
    return `<div class="legend-row">
      <div class="legend-dot" style="background:${color}"></div>
      ${esc(name)} <span style="color:#64748b;font-size:11px">R:${Math.round(a.hearRange||200)} S:${Math.round(a.moveSpeed||80)}</span>
    </div>`;
  }).join('');
}

function updateNarration() {
  const el = document.getElementById('narration-text');
  const label = document.getElementById('dir-label');
  el.textContent = worldNarration || '等待初始化...';
  if (directorActive) {
    label.classList.add('dir-active');
  } else {
    label.classList.remove('dir-active');
  }
}

// Chat: send message as "me" to the simulation
async function sendChat() {
  const input = document.getElementById('chat-input');
  const msg = input.value.trim();
  if (!msg) return;
  input.value = '';

  // Find the player agent
  let meName = 'me';
  const aList = Object.values(agents);
  for (const a of aList) {
    if (a.agentName === 'me' || a.agentName === '\u6211' || a.agentName === '\u4e3b\u4eba') {
      meName = a.agentName; break;
    }
  }

  // Display immediately
  const el = document.getElementById('chat-msgs');
  el.innerHTML += '<div style="color:#38bdf8;margin-bottom:3px;">\u4f60: ' + esc(msg) + '</div>';
  el.scrollTop = el.scrollHeight;

  // Send to backend
  fetch('/api/simulation/send/' + encodeURIComponent(meName), {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({message: msg})
  }).catch(() => {});
}

// Chat input Enter key
document.addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && document.activeElement?.id === 'chat-input') {
    sendChat();
  }
});

async function sendDirective() {
  const input = document.getElementById('directive-input');
  const directive = input.value.trim();
  if (!directive) return;
  input.value = '';
  input.disabled = true;
  document.getElementById('send-dir').disabled = true;
  try {
    const r = await fetch(API+'/directive', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({directive})
    });
    const d = await r.json();
    console.log('Directive sent:', d);
  } catch(e) {
    console.error('Directive failed:', e);
  }
  setTimeout(() => {
    input.disabled = false;
    document.getElementById('send-dir').disabled = false;
    input.focus();
  }, 2000);
}

async function setScene(name) {
  await api('POST', '/scene/' + name);
  await fetchState();
}

// ── Character modal ────────────────────────────────────

let charModalData = [];

function openCharModal() {
  if (running) { alert('请先停止模拟再修改角色'); return; }
  const el = document.getElementById('char-modal');
  if (charModalData.length === 0) {
    charModalData = [
      { name: 'me', persona: '你——可以自由行动的主人', voice: '', background: '' },
      { name: '小明', persona: '开朗外向的年轻人', voice: '说话轻松活泼', background: '程序员' },
      { name: '小红', persona: '温柔细心的女孩', voice: '说话轻声细语', background: '学生' },
    ];
  }
  renderCharForm();
  el.classList.add('show');
}

function closeCharModal() {
  document.getElementById('char-modal').classList.remove('show');
}

function renderCharForm() {
  const el = document.getElementById('char-form-rows');
  el.innerHTML = charModalData.map((c,i) => `
    <div class="char-row">
      <input value="${esc(c.name)}" placeholder="名字" onchange="charModalData[${i}].name=this.value">
      <input class="persona" value="${esc(c.persona)}" placeholder="性格/背景描述" onchange="charModalData[${i}].persona=this.value">
      <button class="del-btn" onclick="removeCharRow(${i})">×</button>
    </div>
  `).join('');
}

function addCharRow() {
  charModalData.push({ name: '', persona: '' });
  renderCharForm();
}

function removeCharRow(i) {
  if (charModalData.length <= 1) { alert('至少保留1个角色'); return; }
  charModalData.splice(i, 1);
  renderCharForm();
}

async function confirmCharModal() {
  const scene = document.getElementById('scene-sel').value;
  const valid = charModalData.filter(c => c.name.trim());
  if (valid.length < 2) { alert('至少需要2个有名字的角色'); return; }

  const body = {
    characters: valid.map(c => ({
      name: c.name.trim(),
      persona: c.persona.trim() || c.name.trim() + '的角色',
      voice: '',
      background: ''
    })),
    scene: scene
  };

  try {
    await api('POST', '/load-characters', body);
    await fetchState();
    if (es) { es.close(); es = null; }
    startSSE();
    closeCharModal();
  } catch(e) {
    alert('加载角色失败: ' + e.message);
  }
}

fetchState();
  fetchState();

// ── Auto-load characters passed from the main app (ScenePage 2D entry) ──
// Reads from URL query (?characters=<json>&scene=<name>) or localStorage
// keys written by the frontend (roleplay_2d_characters / roleplay_2d_scene).
async function autoLoadFromApp() {
  let characters = null;
  let scene = 'park';
  try {
    const params = new URLSearchParams(location.search);
    const charsParam = params.get('characters');
    if (charsParam) {
      const parsed = JSON.parse(charsParam);
      if (Array.isArray(parsed) && parsed.length > 0) characters = parsed;
    }
    if (!characters) {
      const saved = localStorage.getItem('roleplay_2d_characters');
      if (saved) {
        const parsed = JSON.parse(saved);
        if (Array.isArray(parsed) && parsed.length > 0) characters = parsed;
      }
      const savedScene = localStorage.getItem('roleplay_2d_scene');
      if (savedScene) scene = savedScene;
    }
    const sceneParam = params.get('scene');
    if (sceneParam) scene = sceneParam;
  } catch (e) {
    characters = null;
  }
  if (!characters) return;
  const clean = characters.filter(c => c && c.name && String(c.name).trim());
  if (clean.length < 2) return;
  const KNOWN_SCENES = ['park', 'city', 'cafe', 'forest', 'classroom', 'beach'];
  if (!KNOWN_SCENES.includes(scene)) scene = 'park';
  try {
    await api('POST', '/load-characters', {
      characters: clean.map(c => ({
        name: String(c.name).trim(),
        persona: (c.persona || c.name + '，一个角色').trim(),
        voice: c.voice || '',
        background: c.background || ''
      })),
      scene: scene
    });
    await fetchState();
    if (es) { es.close(); es = null; }
    startSSE();
    document.getElementById('status').textContent = 'Loaded ' + clean.length + ' characters from app';
  } catch (e) {
    console.error('Auto-load characters failed:', e);
  }
}
autoLoadFromApp();
