# Test profile: 独立 H2 内存库，与现网数据目录隔离（方案 4.2 硬性约束 #3）
server:
  port: 0

spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

roleplay:
  llm:
    api-base: "http://localhost:9999/mock-llm"
    model: "test-mock"
    max-tokens: 256
    temperature: 0.0
  monitor:
    # D26: 与主 yml 同步——fallback-model/timeout-seconds 属 roleplay.monitor.*（LLMClient 读取处）
    fallback-model: "test-mock"
    timeout-seconds: 5
  memory:
    short-term-rounds: 20
    summary-interval: 10
  round:
    parallel-agents: false
    # C-2 串行调度开关：与主 yml 同步（默认 false=并行；测试中经 setSerialRound 切换验证串行路径）
    serial: false
    agent-max-tokens: 300
    arbiter-max-tokens: 150
  mode:
    default: "free"
    language: "zh"
  game:
    ap:
      # C2 行动点：测试环境与主 yml 同步（ScriptGameService @Value 默认 3，显式声明便于覆盖）
      base: 3
    dm:
      # C4 主持人面板 key：测试默认放开（与审批门同模式）；DM key 越权用例在 controller 层反射注入验证
      key: ""
    discussion:
      # 批次 D 发言门控：与主 yml 同步默认值（silence-floor=0.15 / priority-decay-rounds=3 / wait-bias=0.5 / cold-break=true）
      max-rounds: 2
      silence-floor: 0.15
      priority-decay-rounds: 3
      wait-bias: 0.5
      cold-break: true
    werewolf:
      # P-0802-F 狼人杀自动推进（与主 yml 同步；测试直构服务不经 Spring，@Value 默认值生效）
      ai-night-actions: true
      auto-play: true
      auto-approve-ms: 3000
      witch-poison-probability: 0.5
  auth:
    # 邀请码开关（P-0801-G）：测试置 true 验证启用路径（配置码 B3283A78 可验证通过）；
    # 与主 yml 同步键（invite-code 同值）
    invite-enabled: true
    invite-code: "B3283A78"
  broadcast:
    # 演讲与广播合并地基：公告管线节流参数（测试用默认窗口，便于覆盖节流/合并用例）
    window-ms: 1000
    max-per-window: 5
    max-pending: 20
    recent-ring-size: 100
    # 演讲广播模式（默认 merged=正式版；auto/split 为方案A/B 旧行为回退对比）
    speech-mode: merged
    # 无听众兜底（merged 生效）：true=升级全局公告 / false=仅区域演讲
    fallback-to-global: true
    # 剧本杀阶段切换 SYSTEM 广播总开关（默认 true=启用）
    script-phase-broadcast: true
  frontend:
    dev-mode: false
