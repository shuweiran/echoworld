# Test profile: 独立 H2 内存库，与现网数据目录隔离（方案 4.2 硬性约束 #3）
server:
  port: 0

spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

roleplay:
  llm:
    api-base: "http://localhost:9999/mock-llm"
    model: "test-mock"
    # P-0810-19：与主 yml 同步「默认值」语义（显式传值优先）；测试环境 LLM 为 mock，值不影响断言
    max-tokens: 4000
    # P-0810-21-D：与主 yml 同步（对话主链路 callSync/callStream max_tokens，默认 700；测试显式覆盖）
    dialogue-max-tokens: 700
    temperature: 0.1
    seed: null
    # P-0810-23-D2：与主 yml 同步（RouterService @Value 默认 150，测试经 setRemindThreshold 覆盖）
    remind-threshold: 150
  monitor:
    # D26: 与主 yml 同步——fallback-model/timeout-seconds 属 roleplay.monitor.*（LLMClient 读取处）
    fallback-model: "test-mock"
    timeout-seconds: 5
  memory:
    short-term-rounds: 20
    summary-interval: 10
  round:
    parallel-agents: false
    # C-2 串行调度开关：与主 yml 同步（默认 false=并行；测试中经 setSerialRound 切换验证串行路径）
    serial: false
    # P-0813-A: 与主 yml 同步默认值（3000ms；0=禁用）——一般模式每轮完成后延时自动跑下一轮，
    # 玩家发言打断 pending；测试用例经 setAutoContinueMs 显式缩短延时验证调度
    # P-0814-A: 本键仅在 playback-driven=false 时生效（定时续轮）
    auto-continue-ms: 3000
    # P-0814-A: 点击驱动开关——测试 yml 保持 false（旧定时行为），新行为由测试经
    # setPlaybackDriven(true) 显式验证（与主 yml true 解耦，防 Spring 上下文测试误入等待态）
    playback-driven: false
    # P-0814-B: 与主 yml 同步（2D 对话组等待播出完毕超时；测试经 setGroupAwaitTimeoutMs 显式设置）
    group-await-timeout-ms: 30000
    # P-0813-B: 与主 yml 同步默认值（10；0=禁用）——校准轮间隔；测试用例经 setCalibrateEvery 显式设置
    # （直接构造 RouterService 不经 Spring 时 @Value 不注入 → 默认 0=禁用，既有测试零影响）
    # P-0813-C: 默认 6→10（与主 yml 同步）
    calibrate-every: 10
    agent-max-tokens: 300
    arbiter-max-tokens: 150
  pacing:
    # P-0813-F：与主 yml 同步默认值（测试断言 roleplay.pacing.* 绑定与默认）；
    # 测试用例可直接 setPacing 覆盖或经 AppConfig 断言。
    enabled: true
    director-interval-ms: 15000
    conversation-cooldown-ms: 8000
    round-cooldown-ms: 2000
    group-round-cooldown-ms: 3000
    idle-round-multiplier: 1.5
    inactive-track-multiplier: 4.0
    move-speed-base: 45
    move-speed-random-range: 35
    #   move-speed-player-base / move-speed-player-random-range=玩家角色（playerControlled）分速
    #     （P-0814-I，默认 90+rand×15 → 90-105 px/s）——玩家 WASD/点击移动更跟手；AI 保持 45-80 降密度
    move-speed-player-base: 90
    move-speed-player-random-range: 15
    #   speech-bubble-hold-ms=非玩家轨道发言的气泡停留/展示时长基准（P-0813-H，默认
    #     4000ms；经 conversation-status 的 pacing.speechBubbleHoldMs 下发，前端可作
    #     气泡展示时长/展示间隔参数）
    speech-bubble-hold-ms: 4000
  director:
    # P-0813-I：与主 yml 同步默认值（测试断言 roleplay.director.* 绑定与默认）；
    # 测试用例可直接经 SchedulerService 直构或 SimulationService 注入覆盖。
    schedule-enabled: true
    schedule-window-duration-ms: 300000
    schedule-slots: 6
  track:
    # P-0815-A：与主 yml 同步默认值（测试断言 roleplay.track.conversation-distance 绑定与默认）
    conversation-distance: 70
  mode:
    default: "free"
    language: "zh"
  game:
    # P-0811-D：五层 persona 卡外部持久化目录（与主 yml 同步键；测试指向 target/ 构建目录，
    # 避免污染 ./data/persona；持久化专项用例经 CharacterController.setPersonaCardsDir 指 @TempDir 临时目录）
    persona-cards-dir: "target/persona-test-cards"
    ap:
      # C2 行动点：测试环境与主 yml 同步（ScriptGameService @Value 默认 3，显式声明便于覆盖）
      base: 3
    dm:
      # C4 主持人面板 key：测试默认放开（与审批门同模式）；DM key 越权用例在 controller 层反射注入验证
      key: ""
    map:
      # P-0803-J 剧本杀地图默认尺寸（与主 yml 同步）：默认 24×16（P-0810-21 P0-3 下限 clamp 后实际生效 32×20）；
      # 大图（超 LLM token 预算 40×24）直接走 BSP 确定性生成（ScriptMapService 预算闸）
      default-width: 24
      default-height: 16
      # 尺寸下限（P-0810-21 P0-3，B 方案：测试 yml 同步 min 值，断言同步更新）
      min-width: 32
      min-height: 20
      # BSP 降级种子（与主 yml 同步默认值；测试走显式 seed 时不受影响）
      bsp-seed: 20260801
    discussion:
      # 批次 D 发言门控：与主 yml 同步默认值（silence-floor=0.15 / priority-decay-rounds=3 / wait-bias=0.5 / cold-break=true）
      max-rounds: 2
      silence-floor: 0.15
      priority-decay-rounds: 3
      wait-bias: 0.5
      cold-break: true
    script:
      # P1 剧本杀可玩性修复（与主 yml 同步；测试直构服务不经 Spring，@Value 默认值生效）
      vote-timeout-ms: 60000
      vote-timeout-enabled: true
      quorum-enabled: true
      max-revotes: 3
      game-ttl-ms: 43200000
      web-search-enabled: false
      phase-timeout-ms: 0
    werewolf:
      # P-0802-F 狼人杀自动推进（与主 yml 同步；测试直构服务不经 Spring，@Value 默认值生效）
      ai-night-actions: true
      auto-play: true
      auto-approve-ms: 3000
      witch-poison-probability: 0.5
      witch-save-probability: 1.0
  auth:
    # 邀请码开关（P-0801-G）：测试置 true 验证启用路径（配置码 B3283A78 可验证通过）；
    # 与主 yml 同步键（invite-code 同值）
    invite-enabled: true
    invite-code: "B3283A78"
  broadcast:
    # 演讲与广播合并地基：公告管线节流参数（测试用默认窗口，便于覆盖节流/合并用例）
    window-ms: 1000
    max-per-window: 5
    max-pending: 20
    recent-ring-size: 100
    # 演讲广播模式（默认 merged=正式版；auto/split 为方案A/B 旧行为回退对比）
    speech-mode: merged
    # 无听众兜底（merged 生效）：true=升级全局公告 / false=仅区域演讲
    fallback-to-global: true
    # 剧本杀阶段切换 SYSTEM 广播总开关（默认 true=启用）
    script-phase-broadcast: true
  debug:
    # P-0809-B（API 逻辑链追踪）：与主 yml 同步——默认关闭零打点；测试经 TraceService.setEnabled 显式开启
    trace-enabled: false
    trace-size: 1000
  ai-image:
    # P-0810-01（本地 ComfyUI + Pony V6 XL）：与主 yml 同步键；测试直构服务不经 Spring，@Value/@ConfigurationProperties 默认值生效
    comfyui-base-url: "http://127.0.0.1:1"
    output-dir: "src/main/resources/static/ai-images"
    pool-size: 1
    timeout-seconds: 10
    poll-interval-ms: 50
    lora-name: "pixel_art_sakuemonq_pony.safetensors"
    rmbg-model: "D:\\roleplay-java\\models\\rmbg\\rmbg-1.4.onnx"
    rmbg-enabled: true
    img2img-denoise: 0.5
    characters: []
  frontend:
    dev-mode: false
